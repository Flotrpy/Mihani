name: Release

# Builds and publishes a GitHub Release when a version tag is pushed.
# Mihani ships through GitHub Releases (see README Distribution), not an
# app store, so this is the actual release mechanism: it produces the
# same Windows/macOS installers as ci.yml's windows-installer/
# macos-installer jobs, but on a tag push it also generates SHA256
# checksums and publishes everything as a GitHub Release, so a download
# page can point at a stable "latest release" URL instead of a CI
# artifact link (which expires and requires a GitHub login to fetch).
on:
  push:
    tags: ["v*.*.*"]

jobs:
  verify-tag-matches-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: verify-tag-matches-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run tauri build
      - name: Checksum installers
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi |
            ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash + "  " + $_.Name } |
            Out-File -Encoding ascii mihani-windows-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            mihani-windows-checksums.txt
          if-no-files-found: error

  build-macos:
    needs: verify-tag-matches-version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run tauri build
      - name: Checksum installers
        run: |
          shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg > mihani-macos-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            mihani-macos-checksums.txt
          if-no-files-found: error

  publish:
    needs: [verify-tag-matches-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Merge checksum files
        run: cat release-assets/*checksums.txt > release-assets/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Mihani v${{ needs.verify-tag-matches-version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.dmg
            release-assets/checksums.txt
