[package]
name = "mihani"
version = "0.1.0"
description = "Mihani — multi-agent AI development console"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mihani_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
git2 = "0.19"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
anyhow = "1"
keepawake = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
which = "7"
wait-timeout = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
rand = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
#
# panic is intentionally left at its "unwind" default (not "abort"): the
# tray icon setup in lib.rs relies on catch_unwind to recover from a
# missing libayatana-appindicator3 on some Linux systems without taking
# the whole app down, which requires unwinding to work in release builds too.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
